name: Build Pisces KernelSU kernel

on:
  workflow_dispatch:
    inputs:
      kernelsu_ref:
        description: 可选的KernelSU分支、标签或提交；留空使用已验证的固定提交
        required: false
        default: ""

permissions:
  contents: read

env:
  ARCH: arm
  SUBARCH: arm
  OUT_DIR: out
  DEFCONFIG: tegra11_pisces_user_defconfig
  TOOLCHAIN_ARCHIVE_URL: https://github.com/Deep-sea-lab/kernel_cancro_kernelsu/releases/download/gcc4.9.4/gcc-linaro-4.9.4-2017.01-x86_64_arm-linux-gnueabi.tar.xz
  TOOLCHAIN_ARCHIVE_SHA256: 232302236c90ec136a42d44bc387d2e1199f5df010b77e97ee590216d2b5b181
  KERNELSU_REPOSITORY: https://github.com/backslashxx/KernelSU.git
  KERNELSU_DEFAULT_REF: 2ccdac3db1eacab1768cca67214a246b3b46cbe7

jobs:
  build:
    name: Build tegra11_pisces_user_defconfig
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex git python3 xz-utils

      - name: Download Linaro GCC 4.9.4
        run: |
          TOOLCHAIN_DIR="$RUNNER_TEMP/pisces-toolchain"
          TOOLCHAIN_ARCHIVE="$RUNNER_TEMP/gcc-linaro-4.9.4.tar.xz"
          mkdir -p "$TOOLCHAIN_DIR"
          curl -L --fail --retry 3 --connect-timeout 30 --max-time 300 "$TOOLCHAIN_ARCHIVE_URL" -o "$TOOLCHAIN_ARCHIVE"
          echo "$TOOLCHAIN_ARCHIVE_SHA256  $TOOLCHAIN_ARCHIVE" | sha256sum -c -
          tar -xJf "$TOOLCHAIN_ARCHIVE" -C "$TOOLCHAIN_DIR"
          TOOLCHAIN_PREFIX="$TOOLCHAIN_DIR/gcc-linaro-4.9.4-2017.01-x86_64_arm-linux-gnueabi/bin/arm-linux-gnueabi-"
          test -x "${TOOLCHAIN_PREFIX}gcc"
          "${TOOLCHAIN_PREFIX}gcc" --version
          echo "TOOLCHAIN_PREFIX=$TOOLCHAIN_PREFIX" >> "$GITHUB_ENV"

      - name: Prepare KernelSU at a compatible revision
        env:
          KERNELSU_REF: ${{ inputs.kernelsu_ref }}
        run: |
          git init -q KernelSU
          git -C KernelSU remote add origin "$KERNELSU_REPOSITORY"
          if [ -n "$KERNELSU_REF" ]; then
            git -C KernelSU fetch -q --force --depth=1 origin "$KERNELSU_REF"
          else
            git -C KernelSU fetch -q --force --depth=1 origin "$KERNELSU_DEFAULT_REF"
          fi
          git -C KernelSU -c advice.detachedHead=false checkout -q --detach FETCH_HEAD
          # Linux 3.4's SELinux policy API lacks KernelSU's modern xperm structures.
          git -C KernelSU apply --check "$GITHUB_WORKSPACE/.github/patches/kernelsu-pisces-3.4-minimal.patch"
          git -C KernelSU apply "$GITHUB_WORKSPACE/.github/patches/kernelsu-pisces-3.4-minimal.patch"
          test -f KernelSU/kernel/Kconfig
          test -f KernelSU/kernel/Makefile
          test ! -e drivers/kernelsu
          ln -s ../KernelSU/kernel drivers/kernelsu
          sed -i '/^endmenu$/i source "drivers/kernelsu/Kconfig"\n' drivers/Kconfig
          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          test "$(grep -Fxc 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig)" -eq 1
          test "$(grep -Fxc 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile)" -eq 1
          test "$(readlink drivers/kernelsu)" = "../KernelSU/kernel"
          git -C KernelSU rev-parse HEAD

      - name: Configure kernel
        run: |
          mkdir -p "$OUT_DIR"
          make \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            CROSS_COMPILE="$TOOLCHAIN_PREFIX" \
            HOSTCFLAGS="-fcommon" \
            "$DEFCONFIG"
          make \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            CROSS_COMPILE="$TOOLCHAIN_PREFIX" \
            HOSTCFLAGS="-fcommon" \
            silentoldconfig
          grep -qx 'CONFIG_KSU=y' "$OUT_DIR/.config"
          grep -qx 'CONFIG_KSU_LSM_SECURITY_HOOKS=y' "$OUT_DIR/.config"
          make -s \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            CROSS_COMPILE="$TOOLCHAIN_PREFIX" \
            HOSTCFLAGS="-fcommon" \
            kernelrelease

      - name: Build kernel
        run: |
          make -j"$(nproc)" \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            CROSS_COMPILE="$TOOLCHAIN_PREFIX" \
            HOSTCFLAGS="-fcommon"

      - name: Replace zImage in boot image
        run: |
          IMAGE_PATH="$OUT_DIR/arch/arm/boot/zImage"
          test -s "$IMAGE_PATH"
          KERNEL_RELEASE="$(make -s \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            CROSS_COMPILE="$TOOLCHAIN_PREFIX" \
            HOSTCFLAGS="-fcommon" \
            kernelrelease)"
          BOOT_IMAGE="artifacts/boot-pisces-kernelsu-${KERNEL_RELEASE}-${GITHUB_RUN_NUMBER}.img"

          python3 - ".github/boot.img" "$IMAGE_PATH" "$BOOT_IMAGE" <<'PY'
          from hashlib import sha1, sha256
          from pathlib import Path
          from struct import unpack_from, pack_into, pack
          from sys import argv

          模板路径, 内核路径, 输出路径 = map(Path, argv[1:])
          启动镜像 = 模板路径.read_bytes()
          内核镜像 = 内核路径.read_bytes()
          if 启动镜像[:8] != b"ANDROID!":
              raise SystemExit(f"无效的Android boot镜像: {模板路径}")
          if len(内核镜像) < 0x28 or unpack_from("<I", 内核镜像, 0x24)[0] != 0x016F2818:
              raise SystemExit(f"无效的ARM zImage: {内核路径}")
          读取整数 = lambda 偏移: unpack_from("<I", 启动镜像, 偏移)[0]
          旧内核大小, 内存盘大小, 第二阶段大小, 页面大小, 设备树大小 = map(
              读取整数, (8, 16, 24, 36, 40)
          )
          if 页面大小 < 608 or 页面大小 & (页面大小 - 1):
              raise SystemExit(f"无效的页面大小: {页面大小}")
          对齐大小 = lambda 大小: (大小 + 页面大小 - 1) // 页面大小 * 页面大小
          偏移 = 页面大小 + 对齐大小(旧内核大小)
          内存盘 = 启动镜像[偏移:偏移 + 内存盘大小]
          偏移 += 对齐大小(内存盘大小)
          第二阶段 = 启动镜像[偏移:偏移 + 第二阶段大小]
          偏移 += 对齐大小(第二阶段大小)
          设备树 = 启动镜像[偏移:偏移 + 设备树大小]
          if 偏移 + 对齐大小(设备树大小) != len(启动镜像):
              raise SystemExit("不支持的旧版boot镜像布局")
          文件头 = bytearray(启动镜像[:页面大小])
          pack_into("<I", 文件头, 8, len(内核镜像))
          摘要 = sha1()
          for 数据段 in (内核镜像, 内存盘, 第二阶段, 设备树):
              摘要.update(数据段)
              摘要.update(pack("<I", len(数据段)))
          文件头[576:608] = 摘要.digest() + bytes(12)
          补齐 = lambda 数据段: 数据段 + bytes(对齐大小(len(数据段)) - len(数据段))
          新启动镜像 = bytes(文件头) + b"".join(map(补齐, (内核镜像, 内存盘, 第二阶段, 设备树)))
          输出路径.parent.mkdir(parents=True, exist_ok=True)
          输出路径.write_bytes(新启动镜像)
          print(f"已生成 {输出路径} ({len(新启动镜像)} bytes)")
          print(f"SHA-256: {sha256(新启动镜像).hexdigest()}")
          PY
          test -s "$BOOT_IMAGE"
          git -C KernelSU rev-parse HEAD > artifacts/KernelSU-commit.txt
          echo "BOOT_IMAGE=$BOOT_IMAGE" >> "$GITHUB_ENV"

      - name: Upload repacked boot image
        uses: actions/upload-artifact@v7
        with:
          name: pisces-kernelsu-${{ github.run_number }}
          path: |
            ${{ env.BOOT_IMAGE }}
            artifacts/KernelSU-commit.txt
          if-no-files-found: error
          retention-days: 30
